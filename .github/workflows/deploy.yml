name: Site online zetten
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Lettertypes ophalen
        continue-on-error: true
        run: |
          B=https://cdn.jsdelivr.net/npm
          cd fonts
          curl -fsSLO $B/@fontsource-variable/bricolage-grotesque@5/files/bricolage-grotesque-latin-wght-normal.woff2
          for w in 400 500 600; do curl -fsSLO $B/@fontsource/figtree@5/files/figtree-latin-$w-normal.woff2; done
          for w in 400 500; do curl -fsSLO $B/@fontsource/ibm-plex-mono@5/files/ibm-plex-mono-latin-$w-normal.woff2; done
          ls -la
      - name: Fotos van leveranciers ophalen
        continue-on-error: true
        run: |
          mkdir -p assets/ext && cd assets/ext
          S=https://a.storyblok.com/f/241607/600x800
          curl -fsSL -o woonsleutels.jpg $S/b22cf1f13d/residential-keys.jpg
          curl -fsSL -o transponder.jpg $S/817d4dbcf8/trasponder-keys.jpg
          curl -fsSL -o speciaal.jpg $S/e8b14f0586/mobili-sorting.jpg
          curl -fsSL -o autosleutels.jpg $S/f319a79e51/automotive.jpg
          curl -fsSL -o kleur.jpg $S/a4a4d14de5/color-keys.jpg
          curl -fsSL -o cilinder.jpg https://www.nauta.com/media/catalog/product/V/E/VEIL9242.963_3.jpg
          curl -fsSL -o n-cilinder.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/1/2/143721-category_page_grid_m-cilindersleutels.jpg
          curl -fsSL -o n-baard.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/7/4/143747-category_page_grid_m-klaviersleutel.jpg
          curl -fsSL -o n-dubbelbaard.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/6/8/149986-category_page_grid_m-klaviersleutels_categorie.jpg
          curl -fsSL -o n-kruis.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/2/6/143762-category_page_grid_m-Kruissleutels.jpg
          curl -fsSL -o n-borst.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/7/7/149677-category_page_grid_m-Borstsleutels.jpg
          curl -fsSL -o n-doorn.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/8/7/149678-category_page_grid_m-Doornsleutels.jpg
          curl -fsSL -o n-pijp.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/4/9/149994-category_page_grid_m-Categorie_Pijpsleutel.jpg
          curl -fsSL -o n-dop.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/9/7/149679-category_page_grid_m-Dopsleutels.jpg
          curl -fsSL -o n-transponder.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/4/8/149684-category_page_grid_m-transpondersleutels_2022_2.jpg
          curl -fsSL -o n-behuizing.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/4/2/143724-category_page_grid_m-Autosleutelbehuizingen_cat.jpg
          curl -fsSL -o n-afstand.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/9/8/149689-category_page_grid_m-Programmeerbare-afstandsbediening-auto.jpg
          curl -fsSL -o n-mechanisch.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/5/8/149685-category_page_grid_m-Mechanische_autosleutels.jpg
          curl -fsSL -o c-euro.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/5/3/143735-category_page_grid_m-europrofielcilinder.jpg
          curl -fsSL -o c-staart.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/1/4/143741-category_page_grid_m-staartcilinder_1.jpg
          curl -fsSL -o c-automaat.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/6/3/143736-category_page_grid_m-automatencilinder.jpg
          curl -fsSL -o c-elektro.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/8/4/143748-category_page_grid_m-elektronische-cilinders.jpg
          curl -fsSL -o s-insteek.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/7/6/67-category_page_grid_m-insteeksloten.jpg
          curl -fsSL -o s-meerpunt.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/8/6/68-category_page_grid_m-meerpunts.jpg
          curl -fsSL -o s-hang.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/1/3/143731-category_page_grid_m-hangsloten.jpg
          curl -fsSL -o s-opleg.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/6/5/56-category_page_grid_m-oplegsloten.jpg
          curl -fsSL -o s-fiets.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/2/6/150062-category_page_grid_m-Fietssloten_cat.jpg
          curl -fsSL -o s-meubel.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/9/3/143739-category_page_grid_m-meubelsloten.jpg
          curl -fsSL -o s-garage.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/6/6/66-category_page_grid_m-garagedeursloten.jpg
          curl -fsSL -o s-code.jpg https://www.nauta.com/media/experius/subcategorylistview/cache/4/6/64-category_page_grid_m-codesloten.jpg
          ls -la
      - name: Site klaarzetten
        run: |
          mkdir _site
          cp -r *.html robots.txt sitemap.xml CNAME assets fonts over-ons contacteer-ons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
