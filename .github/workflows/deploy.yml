name: Site online zetten
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Lettertypes ophalen
        continue-on-error: true
        run: |
          B=https://cdn.jsdelivr.net/npm
          cd fonts
          curl -fsSLO $B/@fontsource-variable/bricolage-grotesque@5/files/bricolage-grotesque-latin-wght-normal.woff2
          for w in 400 500 600; do curl -fsSLO $B/@fontsource/figtree@5/files/figtree-latin-$w-normal.woff2; done
          for w in 400 500; do curl -fsSLO $B/@fontsource/ibm-plex-mono@5/files/ibm-plex-mono-latin-$w-normal.woff2; done
          ls -la
      - name: Site klaarzetten
        run: |
          mkdir _site
          cp -r index.html privacy.html 404.html robots.txt sitemap.xml CNAME assets fonts _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
